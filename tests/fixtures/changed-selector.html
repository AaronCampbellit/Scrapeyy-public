<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Changed selector fixture</title></head>
  <body>
    <main id="items">
      <article class="card"><h2>Alpha</h2><a href="/alpha">Alpha details</a></article>
      <article class="card"><h2>Beta</h2><a href="/beta">Beta details</a></article>
    </main>
    <button class="next" type="button">Load incompatible page</button>
    <script>
      document.querySelector(".next").addEventListener("click", (event) => {
        document.querySelector("#items").innerHTML =
          '<article class="changed-card"><h2>Gamma</h2></article>';
        event.currentTarget.remove();
      });
    </script>
  </body>
</html>
